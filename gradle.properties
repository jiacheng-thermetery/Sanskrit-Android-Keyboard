org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Compile Kotlin inside the Gradle process instead of a separate daemon JVM.
# The Kotlin daemon intermittently fails to start ("daemon has terminated
# unexpectedly on startup attempt #1"), which is noisy and occasionally costs a
# build. Running in-process avoids the extra JVM entirely; it needs a bigger
# heap, hence the bump above.
#
# Note: commit daeeccf introduced this claiming it fixed a CI hang. That was a
# misdiagnosis — see the correction in the commit that added this note. There
# was no hang. The setting is kept on its own merits.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
