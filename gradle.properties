org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Compile Kotlin inside the Gradle process instead of a separate daemon JVM.
# The Kotlin daemon outlives `--no-daemon` and keeps the parent's stdout pipe
# open, which hangs CI steps long after the build itself reports success (it
# also intermittently fails to start at all). In-process needs a bigger heap,
# hence the bump above.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
